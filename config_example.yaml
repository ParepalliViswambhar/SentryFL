# Example SentryFL Configuration File
# This demonstrates the nested configuration structure with all supported sections

experiment:
  name: "smd_privacy_experiment"
  output_dir: "./experiments/smd_dp"
  checkpoint_interval: 10
  log_interval: 1
  seed: 42

data:
  dataset: "SMD"  # Options: "SMD", "NSL-KDD"
  window_size: 100
  stride: 1
  normalize: true
  train_ratio: 0.7
  val_ratio: 0.15

model:
  backbone: "bert-base-uncased"
  hidden_dim: 768
  freeze_backbone: true
  dropout: 0.1

training:
  num_rounds: 100
  local_epochs: 5
  batch_size: 32
  learning_rate: 0.001
  optimizer: "adam"  # Options: "adam", "sgd", "adamw"
  weight_decay: 0.0001
  gradient_accumulation_steps: 1

federated:
  num_clients: 10
  clients_per_round: 5
  partition_strategy: "iid"  # Options: "iid", "non_iid"
  aggregation: "fedavg"  # Options: "fedavg", "trimmed_mean"
  byzantine_robust: false
  trimmed_mean_fraction: 0.1

privacy:
  enabled: true
  # v2: mechanism selects the DP scheme.
  #   "dp_fedavg"   - aggregate-level DP-FedAvg (clip client delta + server Gaussian
  #                   noise once per round); the recommended default.
  #   "record_dpsgd"- legacy client-side per-sample Opacus DP-SGD (baseline).
  #   "none"        - no differential privacy.
  mechanism: "dp_fedavg"
  accountant: "prv"  # v2: "prv" (tighter, default) or "rdp" (baseline for comparison)
  epsilon: 8.0  # Must be > 0
  delta: 1e-5  # Must be in (0, 1)
  max_grad_norm: 1.0  # record_dpsgd per-sample clip (> 0)
  clip_norm: 1.0  # v2: dp_fedavg server-side delta clip C (> 0); also the Byzantine bound
  noise_multiplier: null  # Auto-computed from (eps, delta, rounds, sample_rate) if null
  adaptive_clipping: false  # v2 roadmap (Phase 4)

parameter_efficiency:
  # v2: method selects the parameter-efficient adaptation.
  #   "ffa_lora"  - FFA-LoRA (freeze A, train B); recommended, DP-compatible, real
  #                 measured communication reduction.
  #   "lora"      - standard LoRA (train A and B).
  #   "adms"      - legacy Anomaly-Driven Mask Selection (baseline; note: gradient
  #                 zeroing gives ~0 real wire savings, measured via comm_meter).
  #   "full_head" - train the full projection + head (no PEFT).
  method: "ffa_lora"
  lora_rank: 8
  lora_alpha: 16
  lora_targets: ["ts_projection", "head.fc1", "head.fc2"]
  # Legacy ADMS options (used when method == "adms"):
  adms_enabled: false
  selection_ratio: 0.05  # 5% of parameters
  ppds_enabled: false

optimization:
  quantization_enabled: false
  quantization_dtype: "int8"
  knowledge_distillation_enabled: false
  distillation_temperature: 3.0
  distillation_alpha: 0.5

evaluation:
  metrics: ["f1", "auc_roc", "auc_pr", "precision", "recall", "pa_f1", "affiliation"]
  anomaly_threshold: 0.5
  threshold_split: "val"  # v2: fit threshold on held-out val (never test); "test_oracle" = opt-in upper bound
  save_predictions: true
  save_plots: true
