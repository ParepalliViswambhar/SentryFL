<!doctype html>
<html lang="en" style="background:#070c17">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 4 7v8c0 7 5 12 12 15 7-3 12-8 12-15V7z' fill='%23101a30' stroke='%2322d3ee' stroke-width='2'/%3E%3Ccircle cx='16' cy='15' r='3' fill='%2322d3ee'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SentryFL — privacy-preserving federated learning control center for time-series anomaly detection."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>SentryFL — Federated Anomaly Detection</title>
    <script>
      // Set the initial background before React mounts to avoid a light flash
      // in dark mode (and vice-versa). Matches the ColorModeContext default.
      (function () {
        try {
          var mode = localStorage.getItem('sentryfl-color-mode') || 'dark';
          document.documentElement.setAttribute('data-color-mode', mode);
          document.documentElement.style.background = mode === 'light' ? '#eef2f8' : '#070c17';
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
